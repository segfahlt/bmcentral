<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="../theme.css" />
    <style>
      body {
        width: 300px;
        padding: var(--eb-space-4);
      }

      header {
        display: flex;
        align-items: center;
        gap: var(--eb-space-2);
        margin-bottom: var(--eb-space-4);
      }

      header img {
        height: 52px;
        width: auto;
      }

      .wordmark {
        font-family: var(--eb-font-display);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.08em;
        color: var(--eb-blue);
        text-shadow: var(--eb-glow-blue-md);
      }

      .status-row {
        display: flex;
        align-items: center;
        font-size: 12px;
        color: var(--eb-text-secondary);
        margin-bottom: var(--eb-space-4);
      }

      .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--eb-space-2);
      }

      .btn-grid button {
        width: 100%;
      }

      #syncResult {
        font-family: var(--eb-font-mono);
        font-size: 11px;
        line-height: 1.5;
        color: var(--eb-text-secondary);
        margin: var(--eb-space-3) 0 0;
        min-height: 1.5em;
        word-break: break-word;
      }

      #openOptions {
        display: block;
        width: 100%;
        margin-top: var(--eb-space-3);
        padding: var(--eb-space-1) 0;
        background: transparent;
        border: none;
        color: var(--eb-text-muted);
        font-family: var(--eb-font-body);
        font-size: 12px;
        text-align: center;
        cursor: pointer;
      }

      #openOptions:hover {
        color: var(--eb-blue-400);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../../logo.png" alt="" />
      <span class="wordmark">bmcentral</span>
    </header>

    <div class="status-row">
      <span id="statusDot" class="eb-status-dot"></span>
      <span id="status">Checking...</span>
    </div>

    <div class="btn-grid">
      <button id="pushBtn" class="eb-btn eb-btn-primary" title="Send your local bookmark changes to GitHub and open a pull request">Push</button>
      <button id="backupBtn" class="eb-btn" title="Save a snapshot of your current bookmarks to GitHub. Safe — doesn't touch your local bookmarks">Backup</button>
      <button id="pullBtn" class="eb-btn eb-btn-caution" title="Replace your local bookmarks with what's on GitHub. Backs up your current bookmarks first">Pull</button>
      <button id="restoreBtn" class="eb-btn eb-btn-caution" title="Replace your local bookmarks with your last backup on this device">Restore</button>
    </div>

    <p id="syncResult"></p>

    <button id="openOptions" title="Configure your GitHub connection, repository, and device name">Settings</button>

    <script type="module" src="popup.js"></script>
  </body>
</html>
